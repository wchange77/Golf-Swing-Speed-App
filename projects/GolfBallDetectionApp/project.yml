name: GolfBallDetectionApp
options:
  bundleIdPrefix: com.wchange77
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"

packages:
  GolfAnalysisKit:
    path: ../../packages/GolfAnalysisKit

targets:
  GolfBallDetectionApp:
    type: application
    platform: iOS
    sources:
      - path: GolfBallDetectionApp/Sources
      - path: GolfBallDetectionApp/Resources
    dependencies:
      - package: GolfAnalysisKit
    info:
      path: GolfBallDetectionApp/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Golf Ball Detection App needs camera access to detect and track golf balls."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wchange77.GolfBallDetectionApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: GolfBallDetectionApp/GolfBallDetectionApp.entitlements

  GolfBallDetectionAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GolfBallDetectionApp/Tests/Unit
    dependencies:
      - target: GolfBallDetectionApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wchange77.GolfBallDetectionAppTests
        GENERATE_INFOPLIST_FILE: "YES"
